[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-ready-check"
version = "0.1.0"
description = "Audit a repository for release and collaboration readiness."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Repo Ready Check contributors" }
]
keywords = ["github", "repository", "automation", "ci", "release"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
repo-ready-check = "repo_ready_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
